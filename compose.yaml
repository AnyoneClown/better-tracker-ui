name: better-tracker-ui-local

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      BETTER_TRACKER_API_URL: http://api:8000
    ports:
      - "0.0.0.0:43127:43127"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:43127/login')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

networks:
  backend:
    external: true
    name: better-tracker-backend_default
